name: test

on:
  push:
  pull_request:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Unit tests (camera math, shot settings, CLI)
        run: python -B -m unittest discover -s tests -v
      - name: Every script compiles
        run: python -m compileall -q pipeline scripts tracking
      - name: three.js
        run: npm ci --prefix Source --no-audit --no-fund
      - name: SPH bake matches the record for this CPU architecture
        shell: bash
        run: |
          node Water/bake-water.mjs
          python -B tests/check_sph_bake.py
      - name: Water surfaces build
        shell: bash
        run: node Source/shot_surfaces.mjs ci-surfaces 3 24
